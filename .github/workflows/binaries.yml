name: binaries

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          check-latest: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go version
          go build -trimpath -ldflags="-s -w" -o "dist/urlcheck-${GOOS}-${GOARCH}" .

      - uses: actions/upload-artifact@v4
        with:
          name: urlcheck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/urlcheck-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Next version
        id: ver
        run: |
          git fetch --tags --force
          last=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            tag=v0.1.0
          else
            ver=${last#v}
            major=${ver%%.*}
            rest=${ver#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            patch=${patch%%.*}
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "next $tag (prev ${last:-none})"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
